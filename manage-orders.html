<!DOCTYPE html>
<!-- Bloom & Petal - manage-orders.html - Made by: Satyam -->
<html lang="en" data-page="manage-orders" data-roles="florist,owner">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Every order in the shop: search by name or number, filter by status and date, and move orders along.">
  <title>Orders · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="js/app.js"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-sm">
      <div class="wrap">
        <h1>Orders</h1>
        <p class="hero-sub">Every order in one place. Search, filter and move each one along.</p>
        <div class="chips"><span class="chip chip-gold" id="open-chip">Open orders</span></div>
      </div>
    </section>

    <div class="wrap stack-lg section">
      <section class="card card-sm reveal" aria-label="Find orders">
        <div class="stack">
          <div class="toolbar">
            <label class="input-icon grow" id="search-box">
              <span class="sr-only">Search orders</span>
              <input type="search" id="q" placeholder="Order no., customer or receiver" maxlength="60" autocomplete="off">
            </label>
            <select id="when" aria-label="When the order was placed">
              <option value="0">Any time</option>
              <option value="1">Today</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
            </select>
          </div>
          <div>
            <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
          </div>
        </div>
      </section>

      <section class="card card-flush reveal reveal-2" aria-label="Order list">
        <div id="results"></div>
      </section>
    </div>
  </main>
  <script src="js/pages/manage-orders.js"></script>
</body>
</html>
