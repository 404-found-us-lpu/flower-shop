<!DOCTYPE html>
<!-- Bloom & Petal - profile.html - Made by: Yash -->
<html lang="en" data-page="profile" data-roles="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your Bloom &amp; Petal profile: your details, your password and a chart of your orders.">
  <title>My profile · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="js/app.js?v=4"></script>
</head>
<body>
  <main id="main">
    <header class="hero hero-tall">
      <div class="wrap">
        <p class="hero-eyebrow">My profile</p>
        <div class="row">
          <span class="avatar avatar-lg" id="p-avatar" aria-hidden="true"></span>
          <div>
            <h1 id="p-name">My profile</h1>
            <p class="hero-sub">Your details, your password and your orders.</p>
          </div>
        </div>
      </div>
    </header>

    <div class="wrap hero-pull">
      <div class="grid-2">
        <section class="card" aria-labelledby="details-title">
          <div class="card-head">
            <h2 class="card-title" id="details-title">Your details</h2>
          </div>
          <!-- Filled by js/pages/profile.js -->
          <dl id="p-details"></dl>
        </section>

        <section class="card" aria-labelledby="orders-title">
          <div class="card-head">
            <h2 class="card-title" id="orders-title">Your orders</h2>
            <a class="link-arrow" href="orders.html">All orders<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          </div>
          <!-- An inline SVG line chart of your order totals, drawn by js/pages/profile.js -->
          <div id="p-orders"></div>
        </section>
      </div>
    </div>

    <div class="wrap section">
      <div class="grid-2">
        <section class="card" aria-labelledby="edit-title">
          <div class="card-head">
            <div>
              <h2 class="card-title" id="edit-title">Edit details</h2>
              <p class="muted small mb-0">Keep your name, number and address up to date.</p>
            </div>
          </div>
          <form class="form" id="details-form">
            <div class="field">
              <label for="d-name">Full name</label>
              <input id="d-name" name="name" type="text" required minlength="2" maxlength="60" autocomplete="name">
            </div>
            <div class="field">
              <label for="d-phone">Mobile number</label>
              <input id="d-phone" name="phone" type="tel" required pattern="[6-9][0-9]{9}" maxlength="10"
                title="10 digits, starting with 6, 7, 8 or 9" autocomplete="tel-national">
            </div>
            <div class="field">
              <label for="d-address">Address</label>
              <textarea id="d-address" name="address" rows="3" maxlength="200" autocomplete="street-address" placeholder="House, street, area and city"></textarea>
            </div>
            <div>
              <button type="submit" class="btn btn-primary">Save details</button>
            </div>
          </form>
        </section>

        <section class="card" aria-labelledby="password-title">
          <div class="card-head">
            <div>
              <h2 class="card-title" id="password-title">Password</h2>
              <p class="muted small mb-0">You stay signed in after changing it.</p>
            </div>
          </div>
          <form class="form" id="password-form">
            <fieldset class="form">
              <legend>Change your password</legend>
              <div class="field">
                <label for="pw-current">Current password</label>
                <input id="pw-current" name="current" type="password" required autocomplete="current-password">
              </div>
              <div class="field">
                <label for="pw-next">New password</label>
                <input id="pw-next" name="next" type="password" required minlength="6" maxlength="64" autocomplete="new-password" aria-describedby="pw-next-hint">
                <p class="hint" id="pw-next-hint">At least 6 characters.</p>
              </div>
              <div class="field">
                <label for="pw-confirm">Confirm new password</label>
                <input id="pw-confirm" name="confirm" type="password" required minlength="6" maxlength="64" autocomplete="new-password">
              </div>
            </fieldset>
            <div>
              <button type="submit" class="btn btn-primary">Change password</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>
  <script src="js/pages/profile.js?v=4"></script>
</body>
</html>
