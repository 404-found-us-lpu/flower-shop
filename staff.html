<!DOCTYPE html>
<!-- Bloom & Petal - staff.html - Made by: Satyam -->
<html lang="en" data-page="staff" data-roles="florist">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The florist's work board: orders to confirm, bouquets to prepare, deliveries due today and flowers running low.">
  <title>Dashboard · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="js/app.js"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-tall">
      <div class="wrap">
        <h1 id="greeting">Welcome back</h1>
        <p class="hero-sub">Here is what needs your hands today.</p>
        <div class="chips" id="hero-chips"></div>
      </div>
    </section>

    <div class="wrap stack-lg">
      <!-- the dark card that slides up over the green band -->
      <section class="card-dark hero-pull reveal" aria-labelledby="pulse-title">
        <div class="card-head">
          <h2 class="card-title" id="pulse-title">Today at the shop</h2>
          <span class="muted" id="today-date"></span>
        </div>
        <div class="stats" id="stats"></div>
      </section>

      <section class="card reveal reveal-2" aria-labelledby="board-title">
        <div class="card-head">
          <div>
            <h2 class="card-title" id="board-title">Order board</h2>
            <p class="muted small mb-0">Soonest delivery first. One click moves an order to its next step.</p>
          </div>
          <a class="link-arrow" href="manage-orders.html">All orders</a>
        </div>
        <!-- grid-2 + grid-4 together: four columns on wide screens, two on tablets, one on phones -->
        <div class="grid-2 grid-4" id="board"></div>
      </section>

      <div class="split reveal reveal-3">
        <section class="card" aria-labelledby="low-title">
          <div class="card-head">
            <h2 class="card-title" id="low-title">Low stock</h2>
            <a class="link-arrow" href="stock.html">Open stock</a>
          </div>
          <div id="low-stock"></div>
        </section>

        <section class="card" aria-labelledby="deliveries-title">
          <div class="card-head">
            <h2 class="card-title" id="deliveries-title">Today's deliveries</h2>
          </div>
          <div id="deliveries"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="js/pages/staff.js"></script>
</body>
</html>
