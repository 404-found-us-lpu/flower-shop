<!DOCTYPE html>
<!-- Bloom & Petal - orders.html - Made by: Raghav -->
<html lang="en" data-page="orders" data-roles="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your Bloom &amp; Petal orders: follow each one from the shop to the door, look back at past orders and cancel one that is not being prepared yet.">
  <title>My orders · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="js/app.js"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-sm">
      <div class="wrap">
        <h1>My orders</h1>
        <p class="hero-sub">Follow each order from our workbench to the door, and look back at the flowers you have sent.</p>
        <div class="chips" id="order-chips"></div>
      </div>
    </section>
    <div class="wrap section stack">
      <div class="row reveal">
        <div class="tabs" id="order-tabs" role="group" aria-label="Show orders" style="overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none">
          <button type="button" class="tab active" data-tab="all" aria-pressed="true">All <span class="count">0</span></button>
          <button type="button" class="tab" data-tab="active" aria-pressed="false">Active <span class="count">0</span></button>
          <button type="button" class="tab" data-tab="delivered" aria-pressed="false">Delivered <span class="count">0</span></button>
          <button type="button" class="tab" data-tab="cancelled" aria-pressed="false">Cancelled <span class="count">0</span></button>
        </div>
      </div>
      <h2 class="sr-only" id="list-title">All orders</h2>
      <div class="stack reveal reveal-2" id="order-list"></div>
    </div>
  </main>
  <script src="js/pages/orders.js"></script>
</body>
</html>
