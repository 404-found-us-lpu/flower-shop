<!DOCTYPE html>
<!-- Bloom & Petal - home.html - Made by: Raghav -->
<html lang="en" data-page="home" data-roles="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your Bloom &amp; Petal home: your next delivery, Indian favourites, flowers by type, recent orders and a flower-care tip for today.">
  <title>Home · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="js/app.js?v=4"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-tall">
      <div class="wrap">
        <h1 id="hello">Welcome</h1>
        <p class="hero-sub">Fresh flowers for the people you love, delivered across Jalandhar.</p>
      </div>
    </section>

    <!-- The dark card over the hero: the next order to arrive (filled by js/pages/home.js) -->
    <div class="wrap hero-pull">
      <section class="card-dark stack-lg reveal" id="next" aria-labelledby="next-title"></section>
    </div>

    <div class="wrap section stack-lg">
      <section class="card reveal reveal-2" aria-labelledby="indian-title">
        <div class="card-head">
          <h2 class="card-title" id="indian-title">Indian favourites</h2>
          <a class="link-arrow" href="catalog.html?type=Indian%20favourites">See all <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="tiles" id="indian"></div>
      </section>

      <div class="split">
        <section class="card reveal reveal-3" aria-labelledby="types-title">
          <div class="card-head">
            <h2 class="card-title" id="types-title">Shop by type</h2>
            <a class="link-arrow" href="catalog.html">All flowers <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          </div>
          <ul class="list" id="types"></ul>
        </section>

        <!-- <aside>: a side note that goes with the page but is not its main content -->
        <aside class="card reveal reveal-4" aria-labelledby="tip-title">
          <h2 class="card-title" id="tip-title"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M12 9.5a3.5 3.5 0 1 0-3-5.3M14.5 12a3.5 3.5 0 1 0 5.3-3M12 14.5a3.5 3.5 0 1 0 3 5.3M9.5 12a3.5 3.5 0 1 0-5.3 3"/></svg> Tip of the day</h2>
          <p id="tip"></p>
        </aside>
      </div>

      <section class="card" aria-labelledby="recent-title">
        <div class="card-head">
          <h2 class="card-title" id="recent-title">Recent orders</h2>
          <a class="link-arrow" href="orders.html">All orders <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="stack" id="recent"></div>
      </section>
    </div>
  </main>
  <script src="js/pages/home.js?v=4"></script>
</body>
</html>
