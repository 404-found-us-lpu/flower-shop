<!DOCTYPE html>
<!-- Bloom & Petal - home.html - Made by: Raghav -->
<html lang="en" data-page="home" data-roles="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your Bloom &amp; Petal home: the order on its way, flowers by type, your recent orders and flowers picked for you.">
  <title>Home · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script src="js/app.js?v=3"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-tall">
      <div class="wrap">
        <h1 id="hello">Welcome</h1>
        <p class="hero-sub">Your orders and favourite flowers in one place.</p>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <!-- The dark card that slides up over the hero: the newest order still on its way (filled by js/pages/home.js) -->
    <div class="wrap hero-pull">
      <section class="card-dark stack-lg reveal" id="current"></section>
    </div>

    <div class="wrap section stack-lg">
      <div class="split">
        <section class="card reveal reveal-2" aria-labelledby="types-title">
          <div class="card-head">
            <h2 class="card-title" id="types-title">Shop by type</h2>
            <a class="link-arrow" href="catalog.html">All flowers <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          </div>
          <div class="tiles" id="types"></div>
        </section>

        <section class="card reveal reveal-3" aria-labelledby="how-title">
          <div class="card-head">
            <h2 class="card-title" id="how-title">How it works</h2>
          </div>
          <ol class="steps-list" id="steps"></ol>
          <hr class="divider">
          <a class="link-arrow" id="cart-link" href="cart.html">Open your cart</a>
        </section>
      </div>

      <section class="card reveal reveal-4" aria-labelledby="recent-title">
        <div class="card-head">
          <h2 class="card-title" id="recent-title">Recent orders</h2>
          <a class="link-arrow" href="orders.html">All orders <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div id="recent"></div>
      </section>

      <section class="card" aria-labelledby="picked-title">
        <div class="card-head">
          <h2 class="card-title" id="picked-title">Picked for you</h2>
          <a class="link-arrow" href="catalog.html">See all flowers <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div id="picked"></div>
      </section>
    </div>
  </main>
  <script src="js/pages/home.js?v=3"></script>
</body>
</html>
