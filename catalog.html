<!DOCTYPE html>
<!-- Bloom & Petal - catalog.html - Made by: Raghav -->
<html lang="en" data-page="catalog" data-roles="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse every flower at Bloom &amp; Petal, from mogra and marigold to roses and orchids: search, pick a type, sort and add to your cart.">
  <title>Flowers · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="js/app.js?v=4"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-sm">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="home.html">Home</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Flowers</span>
        </nav>
        <h1>Our flowers</h1>
        <p class="hero-sub">Fresh every morning, from mogra and genda to roses and orchids. Delivered across Jalandhar.</p>
      </div>
    </section>

    <div class="wrap section stack-lg">
      <!-- <search> marks the part of the page used to search and filter (it works like role="search") -->
      <search class="card card-sm stack reveal" aria-label="Find flowers">
        <form class="toolbar" id="filters">
          <div class="input-icon grow">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
            <input type="search" id="q" name="q" list="flower-names" placeholder="Search mogra, roses, plants..." maxlength="60" autocomplete="off" aria-label="Search flowers">
            <!-- Suggestions while typing: every flower name (filled by js/pages/catalog.js) -->
            <datalist id="flower-names"></datalist>
          </div>
          <select id="sort" name="sort" aria-label="Sort flowers">
            <optgroup label="Price">
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </optgroup>
            <optgroup label="Name">
              <option value="name" selected>Name: A to Z</option>
            </optgroup>
            <optgroup label="Stock">
              <option value="stock">Most in stock first</option>
            </optgroup>
          </select>
        </form>
        <!-- The 23px corners keep the tab group neat when it wraps onto two lines. -->
        <div class="tabs" id="tabs" role="group" aria-label="Flower type" style="border-radius: 23px;"></div>
      </search>

      <section class="stack reveal reveal-2" aria-label="Flowers">
        <p class="muted mb-0" id="result" aria-live="polite"></p>
        <div class="product-grid" id="grid"></div>
        <div class="card empty" id="empty" hidden>
          <span class="empty-icon"><svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span>
          <h2>No flowers match</h2>
          <p>Try another word or another type, or clear the search to see every flower.</p>
          <button type="button" class="btn btn-primary" data-clear>Clear search</button>
        </div>
      </section>
    </div>
  </main>
  <script src="js/pages/catalog.js?v=4"></script>
</body>
</html>
