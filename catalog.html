<!DOCTYPE html>
<!-- Bloom & Petal - catalog.html - Made by: Raghav -->
<html lang="en" data-page="catalog" data-roles="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse every flower at Bloom &amp; Petal: search, filter by type, sort by price and add bouquets, stems, plants and gifts to your cart.">
  <title>Flowers · Bloom &amp; Petal</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="js/app.js"></script>
</head>
<body>
  <main id="main">
    <section class="hero hero-sm">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="home.html">Home</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Flowers</span>
        </nav>
        <div class="hero-row">
          <div>
            <h1>Our flowers</h1>
            <p class="hero-sub">Fresh every morning. Delivered across Jalandhar.</p>
          </div>
          <div class="row">
            <span class="chip chip-gold" id="shown-chip">All flowers</span>
            <span class="chip" id="delivery-chip">Free delivery</span>
          </div>
        </div>
      </div>
    </section>

    <div class="wrap section stack-lg">
      <!-- Search, sort and filter. Everything updates while you type or click. -->
      <section class="card card-sm stack reveal" aria-label="Find flowers">
        <form class="toolbar" id="filters" role="search">
          <div class="input-icon grow">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
            <input type="search" id="q" name="q" placeholder="Search roses, lilies, plants..." maxlength="60" autocomplete="off" aria-label="Search flowers">
          </div>
          <select id="sort" name="sort" aria-label="Sort flowers">
            <option value="popular">Popular</option>
            <option value="price-asc">Price low to high</option>
            <option value="price-desc">Price high to low</option>
            <option value="name">Name A-Z</option>
          </select>
          <label class="check"><input type="checkbox" id="instock" name="instock" value="1"> In stock only</label>
        </form>
        <div>
          <!-- The 23px corners keep the tab group neat when it wraps onto two lines on a phone. -->
          <div class="tabs" id="tabs" role="group" aria-label="Flower type" style="border-radius: 23px;"></div>
        </div>
      </section>

      <section class="stack reveal reveal-2" aria-label="Flowers">
        <div class="row between">
          <p class="muted mb-0" id="result-text" aria-live="polite"></p>
          <button type="button" class="btn btn-ghost btn-sm" id="clear-top" data-clear hidden>Clear filters</button>
        </div>
        <!-- Cards are a little wider than the default so the price, quantity box and Add button fit on one line. -->
        <div class="product-grid" id="grid" style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));"></div>
        <div class="card empty" id="empty" hidden></div>
      </section>
    </div>
  </main>
  <script src="js/pages/catalog.js"></script>
</body>
</html>
