<!DOCTYPE html>
<!-- Flower Shop Management System - register.html (registration page) - CSE326 - Made by: Yash -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Flower Shop Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar"> <div class="logo">Bloom &amp; Petal</div> <div>New customer</div> </header>
    <main class="container">
        <p><button type="button" class="btn btn-small" onclick="history.back()">Back</button></p>
        <h1>Create an account</h1>
        <p>Please fill this form to become a customer of the shop.</p>
        <div class="card">
            <h2>Registration form</h2>
            <!-- method="get" because the project has no server. alert() shows a message box first. -->
            <form action="index.html" method="get" onsubmit="alert('Account created. Please log in.')">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" placeholder="Your full name" required>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="10 digit number" pattern="[0-9]{10}" maxlength="10" required>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
                <p>
                    <button type="submit" class="btn btn-main">Create account</button>
                    <a href="index.html">I already have an account</a>
                </p>
            </form>
        </div>
    </main>
    <footer class="foot"> Flower Shop Management System - CSE326 Internet Programming - Project<br> Made by Yash, Raghav and Satyam - Section K4P26GH </footer>
</body>
</html>
